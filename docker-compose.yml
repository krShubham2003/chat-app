version: "3.9"
services:
  client:
    build: ./client
    ports:
      - "5173:5173"    # Vite dev server port
    volumes:
      - ./client:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev   # or `npm start` if you're not using nodemon/ts-node
